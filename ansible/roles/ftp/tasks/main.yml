---
- name: Instalar VSFTPD
  zypper:
    name: vsftpd
    state: present

- name: Abrir servicio FTP en el Firewall
  firewalld:
    service: ftp
    permanent: yes
    state: enabled
    immediate: yes

- name: Iniciar y habilitar servicio VSFTPD
  systemd:
    name: vsftpd
    state: started
    enabled: yes
