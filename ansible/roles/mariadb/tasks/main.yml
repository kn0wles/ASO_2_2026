---
- name: Instalar MariaDB y conector Python
  zypper:
    name:
      - mariadb
      - mariadb-client
      - python313-PyMySQL
    state: present

- name: Configurar MariaDB para escuchar en red (bind-address 0.0.0.0)
  copy:
    content: |
      [mysqld]
      bind-address = 0.0.0.0
    dest: /etc/my.cnf.d/99-remote-bind.cnf
    owner: root
    group: root
    mode: '0644'
  notify: Reiniciar MariaDB

- name: Iniciar y habilitar el servicio MariaDB
  systemd:
    name: mariadb
    state: started
    enabled: yes

- name: Abrir puerto de MariaDB en el Firewall
  firewalld:
    service: mysql
    permanent: yes
    state: enabled
    immediate: yes

- name: Crear usuario de Base de Datos con privilegios
  mysql_user:
    name: "{{ vault_db_user }}"
    password: "{{ vault_db_password }}"
    priv: '*.*:ALL'
    host: '%'
    state: present
    column_case_sensitive: false
    login_user: root
    login_unix_socket: /run/mysql/mysql.sock

- name: Eliminar usuarios anonimos de MariaDB (seguridad)
  mysql_user:
    name: ''
    host: '{{ item }}'
    state: absent
    login_user: root
    login_unix_socket: /run/mysql/mysql.sock
    column_case_sensitive: false
  loop:
    - localhost
    - '{{ ansible_hostname }}'
