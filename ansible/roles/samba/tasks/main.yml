---
- name: Instalar paquetes de Samba
  zypper:
    name:
      - samba
      - samba-client
    state: present

- name: Crear usuario del sistema operativo
  user:
    name: "{{ system_user }}"
    state: present
    create_home: yes

- name: Generar hash de contraseña para el usuario del sistema
  ansible.builtin.command:
    argv:
      - openssl
      - passwd
      - -6
      - -salt
      - asosalt1
      - "{{ vault_samba_password }}"
  register: system_user_password_hash
  changed_when: false
  no_log: true

- name: Establecer contraseña y shell del usuario del sistema (FTP/SSH)
  user:
    name: "{{ system_user }}"
    shell: /bin/bash
    password: "{{ system_user_password_hash.stdout }}"

- name: Crear directorio para el recurso compartido
  file:
    path: "{{ samba_share_path }}"
    state: directory
    owner: "{{ system_user }}"
    group: users
    mode: '0775'

- name: Configurar smb.conf mediante plantilla
  template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reiniciar Samba

- name: Crear/Actualizar contraseña del usuario en la base de datos de Samba
  shell: |
    (echo "{{ vault_samba_password }}"; echo "{{ vault_samba_password }}") | smbpasswd -s -a {{ system_user }}
  register: samba_user_create
  changed_when: "'Added user' in samba_user_create.stdout"

- name: Habilitar puerto de Samba en Firewalld
  firewalld:
    service: samba
    permanent: yes
    state: enabled
    immediate: yes

- name: Asegurar que el servicio SMB está activo y habilitado
  systemd:
    name: smb
    state: started
    enabled: yes
